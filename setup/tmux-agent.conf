# =============================================================================
# .tmux.conf — AI Agent Orchestration with Ghostty
# =============================================================================
# Optimized for multi-agent workflows: orchestrator + worker sessions
# Outer terminal: Ghostty | Inner multiplexer: tmux
#
# Install: cp setup/tmux-agent.conf ~/.tmux.conf && tmux source-file ~/.tmux.conf
# =============================================================================

# ---------------------------------------------------------------------------
# 1. GENERAL
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:Tc,xterm-256color:Tc"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 500000
set -sg escape-time 10
set -g focus-events on
set -g remain-on-exit off
setw -g automatic-rename off
set -g allow-rename off

# ---------------------------------------------------------------------------
# 2. BELL PROPAGATION TO GHOSTTY
# ---------------------------------------------------------------------------
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell off
set -g visual-activity off
set -g visual-silence off

# ---------------------------------------------------------------------------
# 3. SILENCE MONITORING (Agent Finish Detection)
# ---------------------------------------------------------------------------
setw -g monitor-silence 30

set-hook -g alert-silence 'run-shell "osascript -e \"display notification \\\"Agent in [#{session_name}:#{window_name}] went silent.\\\" with title \\\"tmux: Agent Idle\\\" sound name \\\"Funk\\\"\" 2>/dev/null"'
set-hook -g alert-silence[1] 'run-shell "printf \"\\a\" 2>/dev/null"'

# ---------------------------------------------------------------------------
# 4. OSC PASSTHROUGH
# ---------------------------------------------------------------------------
set -g allow-passthrough on
set -g set-clipboard on

# ---------------------------------------------------------------------------
# 5. WAIT-FOR INTEGRATION (Inter-Pane Signaling)
# ---------------------------------------------------------------------------
set-hook -g pane-exited 'run-shell "tmux wait-for -S pane-exit-#{pane_id} 2>/dev/null; tmux wait-for -S agent-done-#{window_name} 2>/dev/null; true"'

set-hook -g pane-died 'run-shell " \
  tmux wait-for -S pane-died-#{pane_id} 2>/dev/null; \
  tmux wait-for -S agent-error-#{window_name} 2>/dev/null; \
  osascript -e \"display notification \\\"CRASH: [#{session_name}:#{window_name}] died!\\\" with title \\\"tmux: AGENT CRASH\\\" sound name \\\"Basso\\\"\" 2>/dev/null; \
  true"'

set-hook -g session-closed 'run-shell "tmux wait-for -S session-closed 2>/dev/null; true"'

# ---------------------------------------------------------------------------
# 6. SESSION NAMING
# ---------------------------------------------------------------------------
set -g update-environment "AGENT_ROLE AGENT_SESSION ORCHY_SESSION_NAME"
set-hook -g session-created 'run-shell "tmux set-environment -t \"#{session_name}\" AGENT_SESSION \"#{session_name}\" 2>/dev/null; true"'

# ---------------------------------------------------------------------------
# 7. AUTO-CLEANUP
# ---------------------------------------------------------------------------
set -g destroy-unattached off

set-hook -g window-closed 'run-shell " \
  for s in $(tmux list-sessions -F \"#{session_name}:#{session_windows}\" 2>/dev/null); do \
    name=\"${s%%:*}\"; wins=\"${s##*:}\"; \
    if [ \"$wins\" = \"0\" ]; then tmux kill-session -t \"$name\" 2>/dev/null; fi; \
  done; true"'

# ---------------------------------------------------------------------------
# 8. MOUSE
# ---------------------------------------------------------------------------
set -g mouse on
bind -n WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "copy-mode -e; send-keys -M"
bind -n MouseDown2Pane paste-buffer

# ---------------------------------------------------------------------------
# 9. STATUS BAR — Agent Dashboard
# ---------------------------------------------------------------------------
set -g status-interval 2
set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 120

set -g status-style "bg=#1a1b26,fg=#a9b1d6"

set -g status-left "\
#{?#{==:#{session_name},orchy},#[bg=#9d7cd8#,fg=#1a1b26#,bold] ORCH ,\
#{?#{m:autarkis*,#{session_name}},#[bg=#7aa2f7#,fg=#1a1b26#,bold] WERK ,\
#{?#{==:#{session_name},cityhub},#[bg=#2ac3de#,fg=#1a1b26#,bold] WERK ,\
#{?#{==:#{session_name},finance},#[bg=#e0af68#,fg=#1a1b26#,bold] WERK ,\
#{?#{==:#{session_name},contentos},#[bg=#9ece6a#,fg=#1a1b26#,bold] WERK ,\
#[bg=#565f89#,fg=#c0caf5#,bold] MISC }}}}}\
#[bg=#414868,fg=#c0caf5] #{session_name} #[default] "

set -g status-right "\
#[fg=#565f89]#{pane_current_command} \
#[fg=#414868]| \
#[fg=#7aa2f7]#{window_panes}P \
#[fg=#414868]| \
#[fg=#9ece6a]%H:%M \
#[fg=#414868]| \
#[fg=#e0af68]%m-%d "

setw -g window-status-format " #[fg=#565f89]#I:#W#{?#{window_bell_flag},#[fg=#f7768e] BELL,}#{?#{window_silence_flag},#[fg=#e0af68] IDLE,} "
setw -g window-status-current-format "#[bg=#414868,fg=#c0caf5,bold] #I:#W#{?window_zoomed_flag, Z,} "
setw -g window-status-separator ""
setw -g window-status-bell-style "bg=#f7768e,fg=#1a1b26,bold"
setw -g window-status-activity-style "bg=#e0af68,fg=#1a1b26"

set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-status top
set -g pane-border-format " #{?#{==:#{session_name},orchy},#[fg=#9d7cd8],#[fg=#7aa2f7]}#{pane_index}:#{pane_title} #[fg=#565f89](#{pane_current_command}) "

set -g message-style "bg=#414868,fg=#c0caf5"
set -g message-command-style "bg=#414868,fg=#c0caf5"

# ---------------------------------------------------------------------------
# 10. KEY BINDINGS
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Quick session switching
bind F1 switch-client -t orchy
bind F2 switch-client -t autarkis1
bind F3 switch-client -t autarkis2
bind F4 switch-client -t cityhub
bind F5 switch-client -t finance
bind F6 switch-client -t contentos

# Pane navigation (Alt+arrow, no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-style with prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window navigation
bind -n S-Left previous-window
bind -n S-Right next-window

# Splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# Agent shortcuts
bind O if-shell "tmux has-session -t orchy 2>/dev/null" "switch-client -t orchy" "display-message 'No orchy session'"
bind A choose-tree -s -f "#{?#{m:autarkis*,#{session_name}},1,#{?#{==:#{session_name},orchy},1,#{?#{==:#{session_name},cityhub},1,#{?#{==:#{session_name},finance},1,#{?#{==:#{session_name},contentos},1,0}}}}}"
bind S command-prompt -p "Signal channel:" "run-shell 'tmux wait-for -S %%'"
bind W command-prompt -p "Wait on channel:" "run-shell 'tmux wait-for %%'"
bind B command-prompt -p "Broadcast:" "run-shell 'for p in $(tmux list-panes -F \"#{pane_id}\"); do tmux send-keys -t $p \"%1\" Enter; done'"
bind T command-prompt -p "Pane title:" "select-pane -T '%%'"
bind N command-prompt -p "New session:" "new-session -d -s '%%' -c '#{pane_current_path}'"
bind z resize-pane -Z

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ---------------------------------------------------------------------------
# 11. ALERT HOOKS
# ---------------------------------------------------------------------------
set-hook -g alert-bell 'run-shell "osascript -e \"display notification \\\"Bell in [#{session_name}:#{window_name}]\\\" with title \\\"tmux: Agent Alert\\\" sound name \\\"Glass\\\"\" 2>/dev/null; true"'

set-hook -g pane-exited[1] 'run-shell "osascript -e \"display notification \\\"Pane #{pane_index} in [#{session_name}] exited.\\\" with title \\\"tmux: Pane Exited\\\" sound name \\\"Submarine\\\"\" 2>/dev/null; true"'

set-hook -g pane-died[1] 'run-shell "osascript -e \"display notification \\\"CRASH in [#{session_name}:#{window_name}]!\\\" with title \\\"tmux: AGENT CRASH\\\" sound name \\\"Sosumi\\\"\" 2>/dev/null; true"'

# ---------------------------------------------------------------------------
# 12. LOCAL OVERRIDES
# ---------------------------------------------------------------------------
if-shell "test -f ~/.tmux.local.conf" "source-file ~/.tmux.local.conf"
if-shell "test -f ~/.tmux-agents.conf" "source-file ~/.tmux-agents.conf"

# ---------------------------------------------------------------------------
# USAGE
# ---------------------------------------------------------------------------
# Create sessions:
#   tmux new-session -d -s orchy -c ~/Desktop/code2/orchestrator
#   tmux new-session -d -s autarkis1 -c ~/Desktop/code/Lagerlink\ Hildesheim/autarkis
#   tmux new-session -d -s cityhub -c ~/Desktop/code2/CityHub
#   tmux new-session -d -s finance -c ~/Desktop/code2/Finance-agent
#   tmux new-session -d -s contentos -c ~/Desktop/code2/ContentOS
#
# Wait-for pattern:
#   tmux wait-for agent-done-autarkis1    # blocks until agent signals
#   tmux wait-for -S agent-done-autarkis1 # signal from agent pane
#
# Quick switching: prefix + F1-F6, prefix + O (orchestrator), prefix + A (chooser)
